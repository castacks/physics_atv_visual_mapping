-
  type: talk2dino_seg
  args:
    ontology: {}
    image_insize: [128, 224]
    sharpness: 20.0
    return_logits: true
    # Keep PAMR refinement for high detail.
    apply_pamr: true
    # CUDA autocast FP16 improves performance.
    use_fp16: true
    # Optional fixed-shape DINOv2 engine; unset environments use PyTorch.
    tensorrt_engine: ${TALK2DINO_TENSORRT_ENGINE}
